name: validate

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check shell scripts
        run: bash -n scripts/*.sh
      - name: Compile Python files
        run: python -m py_compile custom_nodes/DualV100/*.py scripts/*.py
      - name: Parse workflows
        run: |
          for workflow in workflows/*.json; do
            python -m json.tool "$workflow" >/dev/null
          done
      - name: Reject model weights
        run: |
          if find . -type f \( -iname '*.gguf' -o -iname '*.safetensors' -o -iname '*.pt' -o -iname '*.pth' \) -print -quit | grep -q .; then
            echo 'Model or latent file found in repository' >&2
            exit 1
          fi
